<div class="control-section">
  <div class="content-wrapper">
    <!-- Header Section -->
    <div class="header-section">
      <h1>PDF Document Management</h1>
      <p>Professional document handling with form fields, signature management, and redaction capabilities</p>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
      <h2>Document Operations</h2>
      <div class="button-group">
        <button (click)="updateSignatureField()">Fill Signature Field</button>
        <button id="searchTextRedact" type="button" (click)="markForRedaction()">
          Mark fields for Redaction (Signature)
        </button>
        <button id="applyRedaction" type="button" (click)="applyRedaction()">
          Apply Redaction
        </button>
        <button id="flattenField" type="button" (click)="handleFlattening()">
          Flatten specific fields (Textbox)
        </button>
        <button id="exportField" type="button" (click)="exportObj()">
          Export form values
        </button>
        <button id="importField" type="button" (click)="importFromObject()">
          Import form values
        </button>
        <button id="extractBarcode" type="button" (click)="extractBarcodes()">
          Barcode Extraction
        </button>
      </div>
    </div>

    <!-- PDF Viewer -->
    <div class="viewer-container">
      <ejs-pdfviewer #pdfviewer id="pdfViewer" [documentPath]="document" [toolbarSettings]="toolbarSettings"
        [resourceUrl]="resource" (formFieldPropertiesChange)="formFieldPropertiesChange($event)"
        style="height:640px;display:block"></ejs-pdfviewer>
    </div>
  </div>
</div>

<div class="loading-backdrop" *ngIf="isBarcodeLoading">
  <div class="loading-card" role="status" aria-live="polite" aria-label="Loading barcode extraction">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loading-text">Extracting barcode JSON...</div>
  </div>
</div>

<div class="dialog-backdrop" *ngIf="showBarcodeDialog">
  <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="barcodeDialogTitle">
    <div class="dialog-header">
      <h3 id="barcodeDialogTitle">JSON</h3>
      <button type="button" class="icon-button" (click)="copyBarcodeJson()" title="Copy JSON">Copy</button>
      <button type="button" class="icon-button close-button" (click)="closeBarcodeDialog()" title="Close">✕</button>
    </div>

    <div class="dialog-body">
      <pre class="json-preview">{{ barcodeDialogJson }}</pre>
    </div>

    <div class="dialog-footer">
      <button type="button" class="primary-button" (click)="closeBarcodeDialog()">OK</button>
    </div>
  </div>
</div>
